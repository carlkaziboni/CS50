{% extends 'guests.html' %}

{% block title %} In progress {% endblock %}

{% block body %}

<table class="table">
    <thead>
      <tr>
        <th scope="col">Suggestion</th>
        <th scope="col">Method</th>
        <th scope="col">Date of completion</th>
        <th scope="col">Delay</th>
      </tr>
    </thead>
    <tbody>
      {% for progress in inprogress %}
      <tr>
        <td>{{ progress[0] }}</td>
        <td>{{ progress[1] }}</td>
        <td>{{ progress[2] }}</td>
        <td>+{{ progress[3] }} days</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
