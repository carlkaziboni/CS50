<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
    <link href="static/site.css" rel="stylesheet">
    <link rel="icon" href="static/sjcicon.ico">
</head>

  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="/"><img src="static/sjcicon.ico" alt="sjc logo" height="100" width="100"></a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
              <a class="nav-link" aria-current="page" href="/">Home</a>
              <a class="nav-link" href="/completed">Completed</a>
              <a class="nav-link" href="/inprogress">In progress</a>
              <a class="nav-link" href="/unapproved">Unapproved</a>
              {% if current_user.is_authenticated %}
              <a class="nav-link" href="/suggestions">Admin</a>
              {% endif %}
              {% if not current_user.is_authenticated %}
              <a class="nav-link" href="/login" style="position: relative; left: 30%;">Login</a>
              {% endif %}
              {% if current_user.is_authenticated %}
              <a class="nav-link" href="/logout" style="position: relative; left: 30%;">Logout</a>
              <a class="nav-link" href="/changepassword" style="position: relative; left: 30%;">Change Password</a>
              {% endif %}
            </div>
          </div>
        </div>
      </nav>
    {% block body %}{% endblock %}
  </body>
</html>
