{% extends 'layout.html' %}

{% block title %}Sell{% endblock %}

{% block main %}
<form action='/sell' method="post">
<div class="mb-3">
    <select class="form-select mx-auto w-auto" name="symbol">
    <option selected disabled>Select</option>
    {% for result in resultdict %}
    {% if resultdict[result] > 0 %}
    <option>{{ result }}</option>
    {% endif %}
    {% endfor %}
</select>
</div>
<div class="mb-3">
    <input autocomplete="off" class="form-control mx-auto w-auto" min="0" name="shares" placeholder="Shares" type="number">
</div>
<div class="mb-3">
    <button class="btn btn-primary" type="submit">Sell</button>
</div>
</form>
{% endblock %}
