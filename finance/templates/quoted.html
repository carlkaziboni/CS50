{% extends "layout.html" %}

{% block title %}
Results
{% endblock %}

{% block main %}
<table class="table">
    <thead>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Price</th>
        <th scope="col">Symbol</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>{{ result['name'] }}</td>
        <td>{{ usd(result['price']) }}</td>
        <td>{{ result['symbol'] }}</td>
      </tr>
    </tbody>
  </table>
{% endblock %}
